<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1032" viewBox="0 0 980 1032" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><line x1="130" y1="95" x2="130" y2="1022" stroke="#2563eb" stroke-opacity="0.35" stroke-width="2"/><rect x="50" y="22" width="160" height="62" rx="12" fill="#2563eb"/><text x="130" y="50" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Khách hàng</text><text x="130" y="70" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-size="12">Trình duyệt</text><line x1="400" y1="95" x2="400" y2="1022" stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="2"/><rect x="320" y="22" width="160" height="62" rx="12" fill="#1e3a5f"/><text x="400" y="50" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Web LaptopNew</text><text x="400" y="70" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-size="12">Next.js + Express API</text><line x1="670" y1="95" x2="670" y2="1022" stroke="#d97706" stroke-opacity="0.35" stroke-width="2"/><rect x="590" y="22" width="160" height="62" rx="12" fill="#d97706"/><text x="670" y="50" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">PayOS</text><text x="670" y="70" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-size="12">Cổng thanh toán</text><line x1="880" y1="95" x2="880" y2="1022" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/><rect x="800" y="22" width="160" height="62" rx="12" fill="#16a34a"/><text x="880" y="50" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">MongoDB</text><text x="880" y="70" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-size="12">Đơn hàng</text><line x1="130" y1="130" x2="396" y2="130" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="130" cy="130" r="13" fill="#1e293b"/><text x="130" y="134.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text><text x="273" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Bấm "Chuyển khoản"</text><text x="273" y="125" text-anchor="middle" font-size="12" fill="#475569">POST /thanh-toan/tao-link (JWT)</text><path d="M400 178 h70 v28 h-70" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#ah)"/><circle cx="400" cy="192" r="13" fill="#1e293b"/><text x="400" y="196.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text><text x="482" y="197" font-size="14" fill="#0f172a">Kiểm tra chủ đơn, lấy số tiền từ DB</text><line x1="400" y1="254" x2="666" y2="254" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="400" cy="254" r="13" fill="#1e293b"/><text x="400" y="258.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text><text x="543" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Tạo yêu cầu thanh toán</text><text x="543" y="249" text-anchor="middle" font-size="12" fill="#475569">orderCode + amount, ký HMAC SHA256</text><line x1="670" y1="316" x2="404" y2="316" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><circle cx="670" cy="316" r="13" fill="#1e293b"/><text x="670" y="320.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text><text x="527" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">checkoutUrl + qrCode</text><text x="527" y="311" text-anchor="middle" font-size="12" fill="#475569">(PayOS chậm >2,2s → dùng VietQR dự phòng)</text><line x1="400" y1="378" x2="876" y2="378" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="400" cy="378" r="13" fill="#1e293b"/><text x="400" y="382.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text><text x="648" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Lưu payos_order_code</text><text x="648" y="373" text-anchor="middle" font-size="12" fill="#475569">trạng thái = chờ thanh toán</text><line x1="400" y1="440" x2="134" y2="440" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><circle cx="400" cy="440" r="13" fill="#1e293b"/><text x="400" y="444.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">6</text><text x="257" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Hiển thị mã QR</text><line x1="130" y1="502" x2="666" y2="502" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="130" cy="502" r="13" fill="#1e293b"/><text x="130" y="506.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">7</text><text x="408" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Quét QR, chuyển khoản ngân hàng</text><rect x="30" y="542" width="920" height="278" rx="12" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="42" y="530" width="388.79999999999995" height="24" rx="6" fill="#16a34a"/><text x="54" y="547" fill="#fff" font-size="13" font-weight="700">Cách 1 — Webhook (chính): PayOS tự gọi về server</text><line x1="670" y1="590" x2="404" y2="590" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="670" cy="590" r="13" fill="#1e293b"/><text x="670" y="594.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">8</text><text x="527" y="570" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">POST /thanh-toan/webhook</text><text x="527" y="585" text-anchor="middle" font-size="12" fill="#475569">{ data, signature }</text><path d="M400 638 h70 v28 h-70" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#ah)"/><circle cx="400" cy="652" r="13" fill="#1e293b"/><text x="400" y="656.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">9</text><text x="482" y="657" font-size="14" fill="#0f172a">Kiểm tra chữ ký, số tiền, chống xử lý lặp</text><line x1="400" y1="714" x2="666" y2="714" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><circle cx="400" cy="714" r="13" fill="#1e293b"/><text x="400" y="718.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">10</text><text x="543" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Trả 200 OK ngay</text><line x1="400" y1="776" x2="876" y2="776" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="400" cy="776" r="13" fill="#1e293b"/><text x="400" y="780.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">11</text><text x="648" y="756" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">da_thanh_toan = true</text><text x="648" y="771" text-anchor="middle" font-size="12" fill="#475569">trạng thái = đã xác nhận · gửi email + Telegram</text><rect x="30" y="850" width="920" height="154" rx="12" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="42" y="838" width="419.2" height="24" rx="6" fill="#7c3aed"/><text x="54" y="855" fill="#fff" font-size="13" font-weight="700">Cách 2 — Polling (dự phòng): Frontend hỏi mỗi 3 giây</text><line x1="130" y1="898" x2="396" y2="898" stroke="#1e293b" stroke-width="2"  marker-end="url(#ah)"/><circle cx="130" cy="898" r="13" fill="#1e293b"/><text x="130" y="902.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">12</text><text x="273" y="878" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">GET /thanh-toan/kiem-tra/:orderCode</text><text x="273" y="893" text-anchor="middle" font-size="12" fill="#475569">chưa thấy PAID → server hỏi lại PayOS</text><line x1="400" y1="960" x2="134" y2="960" stroke="#1e293b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><circle cx="400" cy="960" r="13" fill="#1e293b"/><text x="400" y="964.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">13</text><text x="257" y="940" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">"PAID" → hiện thanh toán thành công</text></svg>