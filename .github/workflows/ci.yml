# CI (Continuous Integration) — GitHub tự chạy mỗi khi push lên main hoặc mở Pull Request.
#
#   1. backend-test     : chạy toàn bộ kiểm thử Jest (unit + integration) của Back-End
#                         với MongoDB chạy trong bộ nhớ → không cần database thật, không cần key bí mật.
#   2. frontend-build   : kiểm tra lint và build production của Front-End Next.js.
#   3. production-smoke : sau khi 2 job trên đạt, kiểm tra nhanh hệ thống đang chạy thật
#                         trên Railway (chỉ chạy khi push lên main).
#
# Lưu ý: smoke test gọi thẳng domain *.up.railway.app vì tên miền trikun.site đứng sau
# Cloudflare Bot Fight Mode — Cloudflare chặn (403) request tự động từ máy chủ GitHub.
# Bước cuối của job ghi lại việc chặn này làm minh chứng lớp chống bot đang hoạt động.
#
# Commit nào làm hỏng test sẽ hiện dấu ❌ trên GitHub, giúp phát hiện lỗi trước khi demo / bàn giao.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

# Push liên tiếp thì hủy lần chạy cũ, chỉ giữ lần mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Back-End · Jest (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BE/package-lock.json

      # Lưu cache bản MongoDB do mongodb-memory-server tải về, các lần sau chạy nhanh hơn
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Cài thư viện
        run: npm ci

      # Quét lỗ hổng trong thư viện chạy trên production; dừng CI nếu có lỗ hổng mức cao trở lên
      - name: Quét lỗ hổng thư viện (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # ESLint bắt lỗi tiềm ẩn; Prettier bảo đảm cả nhóm dùng chung một kiểu định dạng
      - name: Kiểm tra chất lượng mã (ESLint)
        run: npm run lint

      - name: Kiểm tra định dạng mã (Prettier)
        run: npm run format:check

      - name: Chạy kiểm thử và đo độ phủ
        run: npm run test:coverage

      - name: Lưu báo cáo độ phủ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-do-phu-backend
          path: BE/coverage/lcov-report
          retention-days: 14

  frontend-build:
    name: Front-End · Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    env:
      NEXT_PUBLIC_API_URL: https://api.trikun.site/api
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Quét lỗ hổng thư viện (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Kiểm tra lint (ESLint)
        run: npm run lint

      - name: Build production
        run: npm run build

  production-smoke:
    name: Production · Smoke test
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      API_URL: https://laptop.up.railway.app      # service Back-End trên Railway
      WEB_URL: https://shoplaptop.up.railway.app  # service Front-End trên Railway
    steps:
      - uses: actions/checkout@v4

      # Kiểm tra các điểm quan trọng: server sống, tài liệu API, API công khai,
      # API được bảo vệ phải từ chối khi thiếu token, và website Front-End.
      - name: Kiểm tra API và website đang chạy
        run: |
          kiem_tra() { # $1 = mô tả, $2 = mã HTTP mong đợi, $3 = URL, các tham số còn lại truyền cho curl
            mo_ta="$1"; mong_doi="$2"; url="$3"; shift 3
            ma=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors "$@" "$url")
            if [ "$ma" = "$mong_doi" ]; then echo "✅ $mo_ta → $ma"; else echo "❌ $mo_ta → $ma (mong đợi $mong_doi)"; exit 1; fi
          }
          kiem_tra "Health check"                        200 "$API_URL/api/health"
          kiem_tra "Đặc tả OpenAPI"                      200 "$API_URL/api-docs.json"
          kiem_tra "Danh sách sản phẩm (công khai)"      200 "$API_URL/api/san-pham?limit=1"
          kiem_tra "API cần đăng nhập, thiếu token"      401 "$API_URL/api/auth/toi"
          kiem_tra "CORS chặn origin lạ"                 403 "$API_URL/api/health" -H "Origin: https://web-gia-mao.com"
          kiem_tra "Website Front-End"                   200 "$WEB_URL/"

      - name: Chạy bộ Postman giám sát bằng Newman
        run: |
          npx --yes newman@6 run _tai_lieu_bao_cao/postman/LaptopNew_API.postman_collection.json \
            -e _tai_lieu_bao_cao/postman/LaptopNew_Railway.postman_environment.json \
            --folder "14. Giám sát máy chủ" --reporters cli

      # Chỉ ghi nhận, không làm hỏng CI: request tự động từ máy chủ GitHub tới tên miền
      # chính thường bị Cloudflare Bot Fight Mode chặn (403) — đúng như thiết kế bảo mật.
      - name: Ghi nhận Cloudflare chặn bot ở tên miền chính
        run: |
          ma=$(curl -s -o /dev/null -w '%{http_code}' https://api.trikun.site/api/health)
          if [ "$ma" = "403" ]; then
            echo "🛡️ api.trikun.site trả 403 cho request tự động → Cloudflare Bot Fight Mode đang hoạt động"
          else
            echo "ℹ️ api.trikun.site trả $ma"
          fi
